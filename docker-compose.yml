services:
  api:
    build: ./backend
    environment:
      LEDGERFLOW_DATABASE_URL: sqlite:////data/ledgerflow.db
      LEDGERFLOW_UPLOAD_DIR: /data/uploads
      LEDGERFLOW_SEED_DEMO: "true"
      LEDGERFLOW_CORS_ORIGINS: http://localhost:8080
    volumes:
      - ledgerflow_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  ledgerflow_data:
